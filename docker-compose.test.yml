services:
  postgres-test:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: crowdvibe_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d crowdvibe_test"]
      interval: 2s
      timeout: 5s
      retries: 10
